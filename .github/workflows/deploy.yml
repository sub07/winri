name: Deploy Winri installer

on: [workflow_call]

# Serialize releases: a deploy is never cancelled by a later one.
concurrency:
  group: winri-deploy
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      released: ${{ steps.guard.outputs.released }}
    steps:
      - uses: actions/checkout@v7
      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(yq -p toml -oy '.package.version' Cargo.toml)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not extract package version from Cargo.toml"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Skip if release already exists
        id: guard
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag v${VERSION} already exists; skipping release."
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download installer artifact
        if: steps.guard.outputs.released == 'true'
        uses: actions/download-artifact@v8
        with:
          name: winri-executable
      - name: Create hash file
        if: steps.guard.outputs.released == 'true'
        run: |
          sha256sum winri.exe | awk '{print $1}' > winri.exe.sha256.txt
      - name: Create Release
        if: steps.guard.outputs.released == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            winri.exe
            winri.exe.sha256.txt
          name: Version ${{ steps.get_version.outputs.VERSION }}
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
  update-winri-scoop-bucket:
    name: Update Winri Scoop Bucket
    runs-on: ubuntu-latest
    needs: create-release
    if: needs.create-release.outputs.released == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: sub07/winri-bucket
          path: winri-bucket
          ssh-key: ${{ secrets.WINRI_BUCKET_DEPLOY_PRIVATE_KEY }}
      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: winri-executable
      - name: Compute SHA256 hash
        id: compute_hash
        run: |
          HASH=$(sha256sum winri.exe | awk '{print $1}')
          echo "HASH=$HASH" >> "$GITHUB_OUTPUT"
      - name: Update scoop manifest
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          HASH: ${{ steps.compute_hash.outputs.HASH }}
        run: |
          TEMPLATE_FILE=".github/winri.template.json"
          DEST_FILE="winri-bucket/winri.json"
          cp "$TEMPLATE_FILE" "$DEST_FILE"
          sed -i "s/<VERSION>/$VERSION/g" "$DEST_FILE"
          sed -i "s/<SHA256>/$HASH/g" "$DEST_FILE"
          cat "$DEST_FILE"
      - name: Commit and push bucket changes
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          git config --global user.name "winri-actions[bot]"
          git config --global user.email "pardomarius@gmail.com"
          cd winri-bucket
          git add winri.json
          git commit -m "Update Winri to version ${VERSION}"
          git push origin main
