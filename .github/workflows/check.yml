name: Code analysis

on: [workflow_call]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Toolchain (channel + clippy/rustfmt components) comes from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.20.0
      - name: Install cargo-machete
        run: cargo binstall cargo-machete --locked --no-confirm --force
      - name: Run cargo-machete
        run: cargo machete --with-metadata
      - name: Run rustfmt
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --all --all-features --locked
