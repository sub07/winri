on: [push]

jobs:
  check:
    uses: ./.github/workflows/check.yml
  build:
    needs: lint
    uses: ./.github/workflows/build.yml
    if: github.ref == 'refs/heads/main'
  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    if: github.ref == 'refs/heads/main'
