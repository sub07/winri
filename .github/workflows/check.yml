name: Code analysis

on: [workflow_call]

env:
  RUST_VERSION: ${{ vars.RUST_VERSION }}

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.16.0
      - name: Install cargo-machete
        run: cargo binstall cargo-machete --locked --force --no-confirm
      - name: Run cargo-machete
        run: cargo machete --with-metadata
      - name: Run rustfmt
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic -W clippy::nursery -W clippy::dbg_macro -A clippy::missing_errors_doc
      - name: Run tests
        run: cargo test --all --all-features
