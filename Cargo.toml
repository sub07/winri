[package]
name = "winri"
description = "A window scrolling tiler for Windows 11"
version = "0.2.1"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
windows-strings = "0"
log = "0"
log4rs = "1.4.0"
rdev = { version = "0", features = ["unstable_grab"] }
easy-ext = "1"
joy-vector = { git = "https://github.com/sub07/rust-utils", version = "0.2.1" }
joy-error = { git = "https://github.com/sub07/rust-utils", version = "0.6.0", features = ["log-crate", "anyhow-crate"] }
itertools = "0.14.0"
keyboard-types = { version = "0.8.3", features = ["std", "serde"] }
dirs = "6"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi"
]

[dependencies.iced]
git = "https://github.com/sub07/iced.git"
branch = "custom-winri"
features = [
    "debug",
    "time-travel",
    "web-colors",
    "wgpu",
    "canvas",
    "tokio",
    "crisp"
]
default-features = false
