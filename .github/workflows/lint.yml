name: Code analysis

on: [workflow_call]

jobs:
  clippy:
    name: Run Clippy and rustfmt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.16.0
      - name: Install cargo-machete
        run: cargo binstall cargo-machete --locked --force
      - name: Run cargo-machete
        run: cargo machete --with-metadata
      - name: Run rustfmt
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic -W clippy::nursery -W clippy::dbg_macro -A clippy::missing_errors_doc
