on: [push]

# Cancel superseded runs on feature branches, but never cancel a main-branch
# run mid-flight: same-ref main pushes queue so a release completes uninterrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    uses: ./.github/workflows/check.yml
  build:
    needs: check
    uses: ./.github/workflows/build.yml
    if: github.ref == 'refs/heads/main'
  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    if: github.ref == 'refs/heads/main'
