name: Deploy Winri installer

on: [workflow_call]

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download installer artifact
        uses: actions/download-artifact@v5
        with:
          name: winri-executable
      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep -m1 '^version =' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: Create hash file
        id: get_hash
        run: |
          sha256sum winri.exe | awk '{print $1}' > winri.exe.sha256
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            winri.exe
            winri.exe.sha256
          name: Version ${{ steps.get_version.outputs.VERSION }}
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
  update-winri-scoop-bucket:
    name: Update Winri Scoop Bucket
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: sub07/winri-bucket
          path: winri-bucket
          ssh-key: ${{ secrets.WINRI_BUCKET_DEPLOY_PRIVATE_KEY }}
      - name: Download installer artifact
        uses: actions/download-artifact@v5
        with:
          name: winri-executable
      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep -m1 '^version =' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: Compute SHA256 hash
        id: compute_hash
        run: |
          HASH=$(sha256sum winri.exe | awk '{print $1}')
          echo "HASH=$HASH" >> $GITHUB_OUTPUT
      - name: Update scoop manifest
        run: |
          pwd
          TEMPLATE_FILE=".github/winri.template.json"
          DEST_FILE="winri-bucket/winri.json"
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          HASH="${{ steps.compute_hash.outputs.HASH }}"
          cp $TEMPLATE_FILE $DEST_FILE
          sed -i "s/<VERSION>/$VERSION/g" $DEST_FILE
          sed -i "s/<SHA256>/$HASH/g" $DEST_FILE
          cat $DEST_FILE
      - name: Commit and push bucket changes
        run: |
          git config --global user.name "winri-actions[bot]"
          git config --global user.email "pardomarius@gmail.com"
          cd winri-bucket
          git add winri.json
          git commit -m "Update Winri to version ${{ steps.get_version.outputs.VERSION }}"
          git push origin main
