  update-winri-scoop-bucket:
    name: Update Winri Scoop Bucket
    runs-on: ubuntu-latest
    # needs: create-release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: sub07/winri-bucket
          path: winri-bucket
          ssh-key: ${{ secrets.WINRI_BUCKET_DEPLOY_PRIVATE_KEY }}
      # - name: Download installer artifact
      #   uses: actions/download-artifact@v5
      #   with:
      #     name: winri-installer
      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep -m1 '^version =' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo $VERSION
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: Update scoop manifest
        run: |
          pwd
          TEMPLATE_FILE=".github/winri.template.json"
          DEST_FILE="winri-bucket/winri.json"
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          cp $TEMPLATE_FILE $DEST_FILE
          sed -i "s/<VERSION>/$VERSION/g" $DEST_FILE
          cat $DEST_FILE
      - name: Commit and push bucket changes
        shell: bash
        run: |
          git config --global user.name "mpardo"
          git config --global user.email "pardomarius@gmail.com"
          cd winri-bucket
          git add winri.json
          git commit -m "Update Winri to version ${{ steps.get_version.outputs.VERSION }}"
          git push origin main
