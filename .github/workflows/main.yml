on: [push]

jobs:
  check:
    uses: ./.github/workflows/check.yml
  build:
    needs: check
    uses: ./.github/workflows/build.yml
    if: ${{ startsWith(github.head_ref, 'release-') }}
  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    if: ${{ startsWith(github.head_ref, 'release-') }}
