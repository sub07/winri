[package]
name = "winri"
description = "A window scrolling tiler for Windows 11"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
windows-strings = "0"
log = "0"
log4rs = "1.4.0"
rdev = { version = "0", features = ["unstable_grab"] }
easy-ext = "1"
winit = { version = "0" }
raw-window-handle = "0"
oneshot = { version = "0", default-features = false, features = ["std"] }
softbuffer = "0"
channel-protocol = "0.3"
joy-vector = { git = "https://github.com/sub07/rust-utils", version = "0.2.1" }
itertools = "0.14.0"
keyboard-types = { version = "0.8.3", features = ["std", "serde"] }
dirs = "6"
tiny-skia = { version = "0.11.4", features = ["simd", "std"], default-features = false }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi"
]

[package.metadata.cargo-machete]
ignored = [
    "oneshot" # Generated by channel-protocol proc macro so machete can't detect it
]
